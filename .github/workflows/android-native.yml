name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile C wrapper
        run: |
          clang -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/candle_wrapper.c -o src/nativeInterop/cinterop/candle_wrapper.o
          ar rcs src/nativeInterop/cinterop/candle_wrapper.a src/nativeInterop/cinterop/candle_wrapper.o

      # The 64-bit androidNative* targets cross-compile on any host (32-bit retired).
      # Kotlin/Native test binaries are built by the full target gate; this workflow provides
      # explicit compile coverage for every Android Native target.
      - name: Compile Android Native targets
        run: >
          ./gradlew
          compileKotlinAndroidNativeArm64
          compileKotlinAndroidNativeX64
          --no-configuration-cache
