name: Build (WASM)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (WASM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Check JavaScript toolchain
        run: |
          node --version
          npm --version
          yarn --version

      - name: Compile C wrapper
        run: |
          clang -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/candle_wrapper.c -o src/nativeInterop/cinterop/candle_wrapper.o
          ar rcs src/nativeInterop/cinterop/candle_wrapper.a src/nativeInterop/cinterop/candle_wrapper.o
        
      - name: Select existing LLVM tools for the real C Wasm fixture
        run: |
          llvm_bin="$(dirname "$(readlink -f "$(command -v clang)")")"
          test -x "$llvm_bin/clang"
          test -x "$llvm_bin/lld"
          "$llvm_bin/clang" --version
          "$llvm_bin/lld" -flavor wasm --version
          echo "MACRO_FIXTURE_LLVM_BIN=$llvm_bin" >> "$GITHUB_ENV"

      - name: Build and test WASM targets
        # wasmJs runs under both Chrome (browser) and Node; wasmWasi runs
        # under Node with the wasi-preview1 shim. The generated
        # wasmWasiNodeTest runner calls `wasi.finalizeBindings(...)` which
        # only exists on Node 24+ — that's why build.gradle.kts pins
        # `kotlinWasmNodeJsSpec` to 24.15.0 (Active LTS "Krypton").
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
        run: >
          ./gradlew
          wasmJsBrowserTest
          wasmJsNodeTest
          wasmWasiNodeTest
          wasmWasiPreopenTest
          -Pproject.macroFixture.llvmBin="$MACRO_FIXTURE_LLVM_BIN"
          --no-configuration-cache

      - name: Verify actual WASI file IO execution
        run: >
          python3 verification/verify_behavior_results.py
          build/test-results/wasmWasiPreopenTest

      - name: Upload test reports (WASM)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-wasm
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
