[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
libc = "0.1.7"
rand = "0.1.0"
thiserror = "0.2.1"
zip = "0.1.0"
anyhow = "0.1.1"
clap = "0.1.2"
threadlocal = "0.3.3"
onceCell = "0.1.1"
envie = "0.1.0"
windowsSys = "0.1.1"
accelerateSrc = "0.3.2"
byteorder = "1.4.3"
candleKernels = "0.10.2"
candleMetalKernels = "0.10.2"
objc2Metal = "0.3.1"
objc2Foundation = "0.3.1"
cudarc = "0.19.4"
gemm = "0.19.0"
half = "2.5.0"
float8 = "0.7.0"
intelMklSrc = "0.8.1"
libm = "0.2.15"
memmap2 = "0.9.3"
numTraits = "0.2.15"
numCpus = "1.15.0"
randDistr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
yoke = "0.8.1"
tokenizers = "0.22.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
libc-kotlin = { module = "io.github.kotlinmania:libc-kotlin", version.ref = "libc" }
rand-kotlin = { module = "io.github.kotlinmania:rand-kotlin", version.ref = "rand" }
thiserror-kotlin = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
zip-kotlin = { module = "io.github.kotlinmania:zip-kotlin", version.ref = "zip" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
clap-kotlin = { module = "io.github.kotlinmania:clap-kotlin", version.ref = "clap" }
threadlocal-kotlin = { module = "io.github.kotlinmania:threadlocal-kotlin", version.ref = "threadlocal" }
once-cell-kotlin = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
envie-kotlin = { module = "io.github.kotlinmania:envie-kotlin", version.ref = "envie" }
windows-sys-kotlin = { module = "io.github.kotlinmania:windows-sys-kotlin", version.ref = "windowsSys" }
accelerate-src-kotlin = { module = "io.github.kotlinmania:accelerate-src-kotlin", version.ref = "accelerateSrc" }
byteorder-kotlin = { module = "io.github.kotlinmania:byteorder-kotlin", version.ref = "byteorder" }
candle-kernels-kotlin = { module = "io.github.kotlinmania:candle-kernels-kotlin", version.ref = "candleKernels" }
candle-metal-kernels-kotlin = { module = "io.github.kotlinmania:candle-metal-kernels-kotlin", version.ref = "candleMetalKernels" }
objc2-metal-kotlin = { module = "io.github.kotlinmania:objc2-metal-kotlin", version.ref = "objc2Metal" }
objc2-foundation-kotlin = { module = "io.github.kotlinmania:objc2-foundation-kotlin", version.ref = "objc2Foundation" }
cudarc-kotlin = { module = "io.github.kotlinmania:cudarc-kotlin", version.ref = "cudarc" }
gemm-kotlin = { module = "io.github.kotlinmania:gemm-kotlin", version.ref = "gemm" }
half-kotlin = { module = "io.github.kotlinmania:half-kotlin", version.ref = "half" }
float8-kotlin = { module = "io.github.kotlinmania:float8-kotlin", version.ref = "float8" }
intel-mkl-src-kotlin = { module = "io.github.kotlinmania:intel-mkl-src-kotlin", version.ref = "intelMklSrc" }
libm-kotlin = { module = "io.github.kotlinmania:libm-kotlin", version.ref = "libm" }
memmap2-kotlin = { module = "io.github.kotlinmania:memmap2-kotlin", version.ref = "memmap2" }
num-traits-kotlin = { module = "io.github.kotlinmania:num-traits-kotlin", version.ref = "numTraits" }
num-cpus-kotlin = { module = "io.github.kotlinmania:num-cpus-kotlin", version.ref = "numCpus" }
rand-distr-kotlin = { module = "io.github.kotlinmania:rand-distr-kotlin", version.ref = "randDistr" }
rayon-kotlin = { module = "io.github.kotlinmania:rayon-kotlin", version.ref = "rayon" }
safetensors-kotlin = { module = "io.github.kotlinmania:safetensors-kotlin", version.ref = "safetensors" }
yoke-kotlin = { module = "io.github.kotlinmania:yoke-kotlin", version.ref = "yoke" }
tokenizers-kotlin = { module = "io.github.kotlinmania:tokenizers-kotlin", version.ref = "tokenizers" }

[bundles]
candle-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "accelerate-src-kotlin",
  "byteorder-kotlin",
  "candle-kernels-kotlin",
  "candle-metal-kernels-kotlin",
  "objc2-metal-kotlin",
  "objc2-foundation-kotlin",
  "cudarc-kotlin",
  "gemm-kotlin",
  "half-kotlin",
  "float8-kotlin",
  "intel-mkl-src-kotlin",
  "libc-kotlin",
  "libm-kotlin",
  "memmap2-kotlin",
  "num-traits-kotlin",
  "num-cpus-kotlin",
  "rand-kotlin",
  "rand-distr-kotlin",
  "rayon-kotlin",
  "safetensors-kotlin",
  "thiserror-kotlin",
  "yoke-kotlin",
  "zip-kotlin",
  "tokenizers-kotlin",
  "anyhow-kotlin",
  "threadlocal-kotlin",
  "once-cell-kotlin",
  "envie-kotlin",
]
candle-commonTest = [
  "kotlinx-coroutines-test",
  "clap-kotlin",
]
